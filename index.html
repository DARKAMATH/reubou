```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REUBOU — Safari Sénégal</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #menu {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
            linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.65)),
            linear-gradient(#e89b3d, #263d20);
        color: white;
        text-align: center;
    }

    #menu h1 {
        font-size: 80px;
        letter-spacing: 12px;
        text-shadow: 4px 4px 10px #000;
    }

    #menu p {
        font-size: 22px;
        margin: 15px;
    }

    button {
        margin-top: 25px;
        padding: 16px 40px;
        border: none;
        border-radius: 10px;
        background: #e6a33a;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 15px #0008;
    }

    button:hover {
        background: #f3bd54;
        transform: scale(1.05);
    }

    #interface {
        display: none;
        position: fixed;
        z-index: 5;
        inset: 0;
        pointer-events: none;
        color: white;
    }

    #title {
        position: absolute;
        top: 20px;
        left: 25px;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 2px 2px 5px #000;
    }

    #score {
        position: absolute;
        top: 22px;
        right: 25px;
        font-size: 22px;
        text-shadow: 2px 2px 5px #000;
    }

    #mission {
        position: absolute;
        bottom: 25px;
        left: 25px;
        background: rgba(0,0,0,.45);
        padding: 12px 18px;
        border-radius: 10px;
    }

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 35px;
        height: 35px;
        transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
        content: "";
        position: absolute;
        background: white;
        box-shadow: 0 0 4px black;
    }

    #crosshair::before {
        width: 35px;
        height: 2px;
        top: 17px;
    }

    #crosshair::after {
        width: 2px;
        height: 35px;
        left: 17px;
    }

    #help {
        position: absolute;
        bottom: 25px;
        right: 25px;
        text-align: right;
        background: rgba(0,0,0,.45);
        padding: 12px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div id="menu">
    <h1>REUBOU</h1>
    <p>Safari Sénégal 🇸🇳</p>
    <p>Explore la savane avec Lamine Diop</p>
    <button onclick="startGame()">COMMENCER L'AVENTURE</button>
</div>

<div id="interface">
    <div id="title">REUBOU 🇸🇳</div>
    <div id="score">Score : <span id="points">0</span></div>

    <div id="crosshair"></div>

    <div id="mission">
        Mission : observe les animaux de la savane.
    </div>

    <div id="help">
        ZQSD / WASD : déplacer<br>
        Souris : regarder<br>
        Clic : observer
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/PointerLockControls.js";

let scene, camera, renderer, controls;
let points = 0;

const animals = [];
const keys = {};

const clock = new THREE.Clock();

function createScene() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    scene.fog = new THREE.Fog(0xcaa66a, 60, 350);

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 2, 15);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);

    /* LUMIÈRE */

    const sun = new THREE.DirectionalLight(0xffe0a0, 3);

    sun.position.set(80, 120, 50);
    sun.castShadow = true;

    scene.add(sun);

    const ambient = new THREE.HemisphereLight(
        0x87ceeb,
        0x59452d,
        1.5
    );

    scene.add(ambient);

    /* SOL */

    const groundGeometry = new THREE.PlaneGeometry(
        1000,
        1000
    );

    const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0xb99155
    });

    const ground = new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);

    /* BAOBABS */

    for (let i = 0; i < 35; i++) {

        const x = (Math.random() - .5) * 400;
        const z = (Math.random() - .5) * 400;

        createBaobab(x, z);
    }

    /* ANIMAUX */

    createAnimal("Gazelle", 25, -20, 0x9b6b3d);
    createAnimal("Gazelle", -30, -40, 0xb57b43);
    createAnimal("Phacochère", 45, 25, 0x5b4a38);
    createAnimal("Singe", -45, 20, 0x765238);
    createAnimal("Lion", 70, -70, 0xc58b36);

    controls = new PointerLockControls(
        camera,
        document.body
    );

    document.addEventListener("click", () => {

        if (document.getElementById("menu").style.display !== "none") {
            return;
        }

        controls.lock();

    });

    window.addEventListener("keydown", e => {
        keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", e => {
        keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener("resize", resize);

    animate();
}


/* BAOBAB */

function createBaobab(x, z) {

    const group = new THREE.Group();

    const trunkGeometry =
        new THREE.CylinderGeometry(2, 3, 10, 12);

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x6b4932
        });

    const trunk = new THREE.Mesh(
        trunkGeometry,
        trunkMaterial
    );

    trunk.position.y = 5;

    trunk.castShadow = true;

    group.add(trunk);

    const crownGeometry =
        new THREE.SphereGeometry(6, 12, 8);

    const crownMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x315d2c
        });

    const crown = new THREE.Mesh(
        crownGeometry,
        crownMaterial
    );

    crown.position.y = 11;

    crown.scale.y = .7;

    crown.castShadow = true;

    group.add(crown);

    group.position.set(x, 0, z);

    scene.add(group);
}


/* ANIMAUX */

function createAnimal(name, x, z, color) {

    const animal = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.SphereGeometry(1.4, 16, 10),
        new THREE.MeshStandardMaterial({
            color: color
        })
    );

    body.scale.set(1.7, 1, 2);

    body.position.y = 1.5;

    body.castShadow = true;

    animal.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 10),
        new THREE.MeshStandardMaterial({
            color: color
        })
    );

    head.position.set(0, 2.2, -2);

    head.castShadow = true;

    animal.add(head);

    /* oreilles */

    for (let side of [-1, 1]) {

        const ear = new THREE.Mesh(
            new THREE.SphereGeometry(.35, 10, 8),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

        ear.position.set(
            side * .65,
            2.8,
            -2
        );

        animal.add(ear);
    }

    animal.position.set(x, 0, z);

    scene.add(animal);

    animals.push({
        object: animal,
        name: name,
        speed: .2 + Math.random() * .3,
        direction: Math.random() * Math.PI * 2
    });
}


/* DÉPLACEMENT */

function movePlayer() {

    if (!controls.isLocked) return;

    const speed = 0.35;

    if (keys["z"] || keys["w"]) {
        controls.moveForward(speed);
    }

    if (keys["s"]) {
        controls.moveForward(-speed);
    }

    if (keys["q"] || keys["a"]) {
        controls.moveRight(-speed);
    }

    if (keys["d"]) {
        controls.moveRight(speed);
    }

    camera.position.y = 2;
}


/* ANIMAUX */

function moveAnimals(delta) {

    animals.forEach(a => {

        a.direction +=
            (Math.random() - .5) * delta;

        a.object.position.x +=
            Math.sin(a.direction) * a.speed * delta * 10;

        a.object.position.z +=
            Math.cos(a.direction) * a.speed * delta * 10;

        a.object.rotation.y =
            a.direction;
    });
}


/* OBSERVATION */

window.addEventListener("mousedown", () => {

    if (!controls || !controls.isLocked) return;

    const raycaster = new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );

    const objects = [];

    animals.forEach(a => {
        a.object.traverse(child => {
            if (child.isMesh) objects.push(child);
        });
    });

    const hits =
        raycaster.intersectObjects(objects);

    if (hits.length > 0) {

        points += 100;

        document.getElementById("points").textContent =
            points;

        document.getElementById("mission").textContent =
            "Animal observé ! +100 points 🇸🇳";
    }
});


/* BOUCLE */

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    movePlayer();

    moveAnimals(delta);

    renderer.render(scene, camera);
}


/* DÉMARRER */

window.startGame = function() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("interface").style.display =
        "block";

    createScene();

};


/* RESIZE */

function resize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>

</body>
</html>
